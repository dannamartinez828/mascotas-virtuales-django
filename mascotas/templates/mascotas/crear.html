{% extends 'base.html' %}
{% block title %}Adoptar mascota{% endblock %}
{% block content %}
<a class="volver" href="{% url 'listar_mascotas' %}">← Volver</a>
<div class="card formulario">
    <div class="centro">
        <span class="avatar">🥚</span>
        <h1>Adoptar una mascota</h1>
        <p class="sub">Elige quién se unirá a tu familia.</p>
    </div>
    <form method="post" data-carga="rapido">
        {% csrf_token %}
        <label for="nombre">¿Cómo se llamará?</label>
        <input id="nombre" type="text" name="nombre" maxlength="50" placeholder="Ej: Luna" required autofocus>

        <label>¿Qué especie es?</label>
        <div class="picker">
            {% for valor, nombre, emoji in especies %}
                <input type="radio" name="especie" id="esp-{{ valor }}" value="{{ valor }}" {% if forloop.first %}checked{% endif %}>
                <label class="opt" for="esp-{{ valor }}"><span>{{ emoji }}</span>{{ nombre }}</label>
            {% endfor %}
        </div>

        <div style="margin-top: 1.4rem"><button class="btn btn-pri btn-block" type="submit">🐾 Adoptar</button></div>
    </form>
</div>
{% endblock %}
